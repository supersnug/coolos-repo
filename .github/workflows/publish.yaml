name: Publish repository

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-64
            repo: coolos
            directory: coolos/x86_64
            release: '2'
          - target: x86-64-v3
            repo: coolos-v3
            directory: coolos-v3/x86_64
            release: '2.1'
          - target: x86-64-v4
            repo: coolos-v4
            directory: coolos-v4/x86_64
            release: '2.2'
          - target: znver4
            repo: coolos-znver4
            directory: coolos-znver4/x86_64
            release: '2.3'
    env:
      COOLOS_CPU_TARGET: ${{ matrix.target }}
      REPO_DIRECTORY: ${{ matrix.directory }}
      DESKTOP_RELEASE: ${{ matrix.release }}
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver hkps://keyserver.ubuntu.com:443
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf
          pacman -Syu --needed --noconfirm git jq sudo
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages
        run: |
          mkdir -p "public/$REPO_DIRECTORY"
          for recipe in packages/*/PKGBUILD; do
            package_dir="$(dirname "$recipe")"
            if [[ "$COOLOS_CPU_TARGET" != x86-64 ]]; then
              case "$package_dir" in
                packages/opencode-desktop|packages/cachyos-calamares-next) ;;
                *) continue ;;
              esac
            fi
            runuser -u builder -- bash -c "cd '$GITHUB_WORKSPACE/$package_dir' && makepkg --syncdeps --noconfirm"
            cp "$package_dir"/*.pkg.tar.zst "public/$REPO_DIRECTORY/"
          done

      - name: Validate package archives
        run: |
          for package in "public/$REPO_DIRECTORY/"*.pkg.tar.zst; do
            bsdtar -tf "$package" > /tmp/package-files
            grep -qx '\.PKGINFO' /tmp/package-files
            if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/package-files; then exit 1; fi

            bsdtar -xOf "$package" .PKGINFO > /tmp/package-info
            grep -Eq '^arch = (any|x86_64)$' /tmp/package-info
          done

      - name: Verify OpenCode desktop package
        run: |
          package="public/$REPO_DIRECTORY/opencode-desktop-2.0.5-$DESKTOP_RELEASE-x86_64.pkg.tar.zst"
          test -f "$package"
          bsdtar -xOf "$package" .PKGINFO > /tmp/opencode-desktop.pkginfo
          grep -qx "pkgver = 2.0.5-$DESKTOP_RELEASE" /tmp/opencode-desktop.pkginfo
          grep -qx 'depend = opencode=2.0.5' /tmp/opencode-desktop.pkginfo
          grep -qx 'optdepend = nodejs: needed only by npm CLI helpers bundled in node_modules' /tmp/opencode-desktop.pkginfo
          grep -qx 'depend = electron42' /tmp/opencode-desktop.pkginfo
          bsdtar -tf "$package" > /tmp/desktop-files
          if grep -Eq '\.musl\.node$|/-musl[^/]*/' /tmp/desktop-files; then exit 1; fi
          bsdtar -xOf "$package" usr/lib/opencode-desktop/package.json |
            jq -e '.desktopName == "opencode-desktop"'
          bsdtar -xOf "$package" usr/share/applications/opencode-desktop.desktop |
            grep -qx 'Exec=opencode-desktop %U'
          mkdir -p /tmp/opencode-desktop-main
          bsdtar -xf "$package" -C /tmp/opencode-desktop-main usr/lib/opencode-desktop/out/main
          grep -rq '/usr/bin/opencode' /tmp/opencode-desktop-main
          if grep -rEq '\.isPackaged' /tmp/opencode-desktop-main --include='*.js'; then exit 1; fi

      - name: Verify portable Desktop native module
        run: |
          bash tests/desktop-native.sh "public/$REPO_DIRECTORY/opencode-desktop-2.0.5-$DESKTOP_RELEASE-x86_64.pkg.tar.zst" "$COOLOS_CPU_TARGET"

      - name: Verify settings upgrade policy
        if: matrix.target == 'x86-64'
        run: |
          bash tests/settings-upgrade.sh \
            public/coolos/x86_64/coolos-config-1.0.0-2-any.pkg.tar.zst \
            public/coolos/x86_64/coolos-niri-settings-1.0.0-2-any.pkg.tar.zst

      - name: Verify portable Calamares build
        run: |
          package="$(find "public/$REPO_DIRECTORY" -name 'cachyos-calamares-next-*.pkg.tar.zst' -print -quit)"
          library_path="$(bsdtar -tf "$package" | grep -E '^usr/lib/libcalamaresui\.so\.[0-9]+\.[0-9]+\.[0-9]+$')"
          test -n "$library_path"
          bsdtar -xOf "$package" "$library_path" > /tmp/libcalamaresui.so
          readelf -n /tmp/libcalamaresui.so | tee /tmp/libcalamaresui.notes
          bash tests/cpu-isa.sh /tmp/libcalamaresui.so "$COOLOS_CPU_TARGET"

      - name: Upload tier packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.repo }}
          path: public/
          retention-days: 3

  publish:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: archlinux:base-devel
    steps:
      - name: Install publishing tools
        run: pacman -Syu --needed --noconfirm git

      - name: Download all tiers
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: public
          merge-multiple: true

      - name: Sign repository
        env:
          COOLOS_GPG_SIGNING_KEY: ${{ secrets.COOLOS_GPG_SIGNING_KEY }}
          COOLOS_GPG_SIGNING_PASSPHRASE: ${{ secrets.COOLOS_GPG_SIGNING_PASSPHRASE }}
        run: |
          test -n "$COOLOS_GPG_SIGNING_KEY"
          test -n "$COOLOS_GPG_SIGNING_PASSPHRASE"
          printf '%s' "$COOLOS_GPG_SIGNING_KEY" | gpg --batch --import
          signing_fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$signing_fingerprint"

          while IFS= read -r -d '' package; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 3 --local-user "$signing_fingerprint" \
              --detach-sign "$package" 3<<< "$COOLOS_GPG_SIGNING_PASSPHRASE"
          done < <(find public -name '*.pkg.tar.zst' -print0)

          for repo in coolos coolos-v3 coolos-v4 coolos-znver4; do
            directory="public/$repo/x86_64"
            repo-add "$directory/$repo.db.tar.gz" "$directory/"*.pkg.tar.zst
            for database in "$directory/$repo.db.tar.gz" "$directory/$repo.files.tar.gz"; do
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 3 --local-user "$signing_fingerprint" \
                --detach-sign "$database" 3<<< "$COOLOS_GPG_SIGNING_PASSPHRASE"
            done
            for kind in db files; do
              rm "$directory/$repo.$kind"
              cp "$directory/$repo.$kind.tar.gz" "$directory/$repo.$kind"
              cp "$directory/$repo.$kind.tar.gz.sig" "$directory/$repo.$kind.sig"
            done
          done

      - name: Create repository index
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en"><meta charset="utf-8"><title>CoolOS Repository</title>' \
            '<h1>CoolOS Package Repository</h1>' \
            '<p>Use <code>https://coolos-repo.sarulean.com/$repo/$arch</code> as the Pacman server.</p>' \
            '</html>' > public/index.html
          printf '%s\n' 'coolos-repo.sarulean.com' > public/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
